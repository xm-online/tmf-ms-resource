/*
 * Plugin that provides API-first development using OpenAPI-generator to
 * generate Spring-MVC endpoint stubs at compile time from an OpenAPI definition file
 */
buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "org.openapitools:openapi-generator-gradle-plugin:${openapiPluginVersion}"
    }
}
apply plugin: "org.openapi.generator"

import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

void createOpenApiGenerateTask(String taskName, String ymlName, String apiPackageName, String modelPackageName,
                               boolean strict) {
    tasks.register(taskName, GenerateTask) {
        generatorName = "spring"
        inputSpec = "$rootDir/src/main/resources/swagger/${ymlName}.yml".toString()
        outputDir = layout.buildDirectory.dir("openapi").get().asFile.toString()
        apiPackage = apiPackageName
        modelPackage = modelPackageName
        apiFilesConstrainedTo = [""]
        modelFilesConstrainedTo = [""]
        supportingFilesConstrainedTo = ["ApiUtil.java"]
        configOptions = [delegatePattern: "true", useSpringBoot3: "true", useJakartaEe: "true",
                         // Jackson 3 deserializes through a required-args constructor: absent fields became null
                         // instead of the model defaults. The 4.x generator had no such constructor
                         generatedConstructorWithRequiredArgs: "false",
                         // the 4.x generator left unset collections null, generator 7 initializes them with []
                         containerDefaultToNull: "true"]
        if (strict) {
            validateSpec = true
            importMappings = [Problem:"org.zalando.problem.Problem"]
        } else {
            additionalProperties = [useTags: "true"]
        }
    }
    compileJava.dependsOn(taskName)
}

createOpenApiGenerateTask("openApiGenerateAdmin", "admin",
    "com.icthh.xm.tmf.ms.resource.web.api", "com.icthh.xm.tmf.ms.resource.web.api.model", true)
createOpenApiGenerateTask("openApiGenerateRegular", "regular",
    "com.icthh.xm.tmf.ms.resource.web.api", "com.icthh.xm.tmf.ms.resource.web.api.model", true)
createOpenApiGenerateTask("openApiGenerateV4", "api_v4",
    "com.icthh.xm.tmf.ms.resource.web.api.v4", "com.icthh.xm.tmf.ms.resource.web.api.model.v4", false)
tasks.register('allOpenApiGenerate') {
    dependsOn 'openApiGenerateAdmin', 'openApiGenerateRegular', 'openApiGenerateV4'
}

sourceSets {
    main {
        java {
            srcDir file(layout.buildDirectory.dir("openapi/src/main/java").get().asFile)
        }
    }
}
